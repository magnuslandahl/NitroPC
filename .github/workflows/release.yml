name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: |
          dotnet build NitroPC.sln -c Release --nologo
          dotnet test NitroPC.sln -c Release --no-build --nologo

      - name: Select version
        id: version
        shell: pwsh
        run: |
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { '${{ inputs.version }}' }
          $version = $raw.TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version '$raw'. Expected vX.Y.Z or X.Y.Z."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish release packages
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $sumLines = @()

          foreach ($rid in @('win-x64', 'win-arm64')) {
            $appOutput = "artifacts\app-$rid"
            $updaterOutput = "artifacts\updater-$rid"
            dotnet publish src\NitroPC\NitroPC.csproj -c Release -r $rid --self-contained false -o $appOutput -p:Version=$version
            dotnet publish src\NitroPC.Updater\NitroPC.Updater.csproj -c Release -r $rid --self-contained false -o $updaterOutput -p:Version=$version

            Copy-Item "$updaterOutput\NitroPC.Updater.exe" $appOutput
            Copy-Item "$updaterOutput\NitroPC.Updater.dll" $appOutput
            Copy-Item "$updaterOutput\NitroPC.Updater.deps.json" $appOutput
            Copy-Item "$updaterOutput\NitroPC.Updater.runtimeconfig.json" $appOutput

            $zipName = "NitroPC-$rid.zip"
            $zipPath = Join-Path "artifacts" $zipName
            Compress-Archive -Path "$appOutput\*" -DestinationPath $zipPath -Force
            $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $sumLines += "$hash  $zipName"
          }

          [IO.File]::WriteAllText(
            (Join-Path $PWD 'artifacts\SHA256SUMS.txt'),
            ($sumLines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false))

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            artifacts\NitroPC-win-x64.zip `
            artifacts\NitroPC-win-arm64.zip `
            artifacts\SHA256SUMS.txt `
            --target "$env:GITHUB_SHA" `
            --title "NitroPC ${{ steps.version.outputs.version }}" `
            --generate-notes
