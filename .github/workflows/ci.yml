name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore NitroPC.sln

      - name: Verify formatting
        run: dotnet format NitroPC.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build NitroPC.sln -c Release --no-restore --nologo

      - name: Run unit tests
        run: dotnet test NitroPC.sln -c Release --no-build --nologo

      - name: Build installers & update packages
        shell: pwsh
        run: .\installer\build-release-packages.ps1 -Version 0.0.1 -OutputDir artifacts

      - name: Smoke-test Windows installer & uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'NitroPC-SmokeInstall'
          $setup = Resolve-Path 'artifacts\NitroPC-win-x64-Setup.exe'
          $installProc = Start-Process -FilePath $setup.Path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""', "/DIR=`"$smokeDir`"") -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($installProc.ExitCode)."
          }
          if (-not (Test-Path "$smokeDir\NitroPC.exe") -or -not (Test-Path "$smokeDir\NitroPC.Updater.exe") -or -not (Test-Path "$smokeDir\unins000.exe")) {
            throw "Installer did not lay down expected files in '$smokeDir'."
          }
          $uninstallProc = Start-Process -FilePath "$smokeDir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProc.ExitCode -ne 0) {
            throw "Silent uninstaller failed with exit code $($uninstallProc.ExitCode)."
          }
